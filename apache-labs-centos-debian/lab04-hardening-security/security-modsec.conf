<IfModule security2_module>
    # Activar el motor en modo bloqueo (en lugar de DetectionOnly)
    SecRuleEngine On

    # Reglas básicas de prueba inmediata (además de OWASP CRS)
    SecRule ARGS "@rx (?i:union\s+select|or\s+'1'='1|<script>)" \
        "id:100001,phase:2,deny,status:403,log,msg:'Ataque Web Detectado en Laboratorio'"
</IfModule>

