<IfModule mod_evasive24.c>
    DOSHashTableSize    3097
    # Máximo 5 peticiones a la misma página en 1 segundo
    DOSPageCount        5
    DOSPageInterval     1
    # Máximo 50 peticiones al sitio completo en 1 segundo
    DOSSiteCount        50
    DOSSiteInterval     1
    # Tiempo de bloqueo en segundos
    DOSBlockingPeriod   15
    DOSLogDir           "/var/log/mod_evasive"
</IfModule>

