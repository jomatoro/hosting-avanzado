<VirtualHost *:80>
    ServerName suexec.lab.local
    DocumentRoot /var/www/html

    # Ejecutar scripts CGI bajo el usuario alumno1
    SuexecUserGroup alumno1 alumno1

    <Directory /var/www/html/cgi-test>
        Options +ExecCGI
        AddHandler cgi-script .cgi
        Require all granted
    </Directory>
</VirtualHost>

