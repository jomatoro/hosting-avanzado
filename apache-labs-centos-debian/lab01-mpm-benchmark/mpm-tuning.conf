# Ajustes de capacidad para pruebas de carga en laboratorio
<IfModule mpm_prefork_module>
    StartServers              4
    MinSpareServers           4
    MaxSpareServers          10
    MaxRequestWorkers       150
    MaxConnectionsPerChild 1000
</IfModule>

<IfModule mpm_worker_module>
    StartServers              2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadsPerChild          25
    MaxRequestWorkers       150
    MaxConnectionsPerChild 1000
</IfModule>

<IfModule mpm_event_module>
    StartServers              2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadsPerChild          25
    MaxRequestWorkers       150
    MaxConnectionsPerChild 1000
</IfModule>

