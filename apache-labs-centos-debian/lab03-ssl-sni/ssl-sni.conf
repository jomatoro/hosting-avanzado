# Redirección HTTP -> HTTPS para ambos sitios
<VirtualHost *:80>
    ServerName tienda.lab.local
    Redirect permanent / https://lab.local
</VirtualHost>

<VirtualHost *:80>
    ServerName blog.lab.local
    Redirect permanent / https://lab.local
</VirtualHost>

# Sitio 1 HTTPS (SNI)
<VirtualHost *:443>
    ServerName tienda.lab.local
    DocumentRoot /var/www/tienda.lab.local

    SSLEngine on
    SSLCertificateFile /etc/ssl/apache-lab/tienda.lab.local.crt
    SSLCertificateKeyFile /etc/ssl/apache-lab/tienda.lab.local.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/tienda.lab.local>
        Require all granted
    </Directory>
</VirtualHost>

# Sitio 2 HTTPS (SNI)
<VirtualHost *:443>
    ServerName blog.lab.local
    DocumentRoot /var/www/blog.lab.local

    SSLEngine on
    SSLCertificateFile /etc/ssl/apache-lab/blog.lab.local.crt
    SSLCertificateKeyFile /etc/ssl/apache-lab/blog.lab.local.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/blog.lab.local>
        Require all granted
    </Directory>
</VirtualHost>

