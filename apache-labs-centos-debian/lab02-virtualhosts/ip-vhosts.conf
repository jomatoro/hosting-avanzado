# VirtualHosts basados en dirección IP distinta
<VirtualHost 192.168.56.101:80>
    ServerAdmin webmaster@lab.local
    DocumentRoot /var/www/ip1
    ServerName ip1.lab.local

    <Directory /var/www/ip1>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost 192.168.56.102:80>
    ServerAdmin webmaster@lab.local
    DocumentRoot /var/www/ip2
    ServerName ip2.lab.local

    <Directory /var/www/ip2>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

