# VirtualHosts basados en Nombre (comparten misma IP y puerto)
<VirtualHost *:80>
    ServerName app1.lab.local
    ServerAlias www.app1.lab.local
    DocumentRoot /var/www/app1

    <Directory /var/www/app1>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName app2.lab.local
    ServerAlias www.app2.lab.local
    DocumentRoot /var/www/app2

    <Directory /var/www/app2>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

